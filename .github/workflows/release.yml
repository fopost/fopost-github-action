name: Release

# Tag the commit `v<version>` matching package.json, e.g. v0.1.0.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION but tag is $TAG"; exit 1; }

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # A release that ships a stale bundle ships the previous version's code.
      - name: Verify the committed bundle is current
        run: |
          npm run build
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ does not match the source on this ref. Rebuild, commit, and re-tag."
            exit 1
          fi

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      # Consumers pin `fopost/fopost-github-action@v0`, so the floating major
      # tag has to follow every release on that major. A lightweight tag needs
      # no committer identity.
      - name: Move the major version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR"
          echo "$MAJOR now points at $GITHUB_SHA"
