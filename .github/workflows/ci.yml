name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  bundle:
    name: dist is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to one version on purpose: the committed bundle has to be
      # byte-identical to what this job produces, and that only holds when
      # everyone builds on the same toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail if dist/ is stale
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is out of date. Run \`npm run build\` and commit the result."
            exit 1
          fi
          echo "dist/ matches the source."
